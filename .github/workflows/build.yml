name: Build DTV Tools GUI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # anexar os arquivos ao release de uma tag
  id-token: write       # atestado de procedência (attest-build-provenance)
  attestations: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Testes (Linux, sem tela)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: gui/requirements.txt
      - name: Bibliotecas do Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: pip install -r gui/requirements.txt
      - name: Testes do script e contrato com a interface
        run: pip install pytest && python -m pytest -q
      - name: Testes funcionais da GUI
        run: python tests/gui/functional.py
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64,   os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64,   os: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: gui/requirements.txt

      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Dependências
        run: pip install -r gui/requirements.txt pyinstaller

      - name: Versão
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) V="0.0.0-dev.${GITHUB_RUN_NUMBER}" ;; esac
          echo "DTV_VERSION=$V" >> "$GITHUB_ENV"

      # Mesmo script que você roda localmente. Não embute ffmpeg/MP4Box/mpegh*: o usuário os aponta em "Ferramentas e pastas"
      # (ou coloca em tools/ ao lado do app). Faz: PyInstaller -> teste de fumaça -> pacote + SHA-256 em release/.
      # macOS: importa o certificado Developer ID num chaveiro temporário (só se o segredo existir)
      - name: Certificado macOS
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then echo "Sem certificado macOS: o app sai sem Developer ID."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"; KP="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      # Assinatura é opcional: sem os segredos/variáveis abaixo (por exemplo em forks e pull requests) o executável sai sem assinatura.
      #   Windows: segredos WINDOWS_CERT_PFX_BASE64 e WINDOWS_CERT_PASSWORD
      #   macOS:   segredo MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD
      #            e a variável MACOS_SIGN_IDENTITY ("Developer ID Application: Nome (TEAMID)")
      #   Para exigir assinatura nos releases (falha sem certificado), crie a variável REQUIRE_SIGNING = true
      - name: Gerar, assinar, testar e empacotar
        env:
          DTV_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          DTV_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          DTV_MAC_IDENTITY: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && vars.MACOS_SIGN_IDENTITY || '' }}
          DTV_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          DTV_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          DTV_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          REQUIRE: ${{ startsWith(github.ref, 'refs/tags/v') && vars.REQUIRE_SIGNING == 'true' && runner.os != 'Linux' }}
        run: |
          EXTRA=""
          if [ "$REQUIRE" = "true" ]; then EXTRA="--require-signing"; fi
          python gui/packaging/build.py --version "$DTV_VERSION" $EXTRA

      # Atestado de procedência (GitHub): prova que o arquivo saiu deste repositório e deste workflow. Só em tags; não bloqueia se o plano não suportar.
      - name: Atestado de procedência
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
            release/*.tar.gz
            release/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DTV-Tools-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: DTV-Tools-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
